# Deploys to Cloud Run on every push to main (i.e. every merged PR).
# Mirrors deploy.sh. One-time Google Cloud + GitHub setup: see CI-DEPLOY.md.

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; a newer merge waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: metal-apricot-343704
  REGION: us-central1
  SERVICE_NAME: fitness-tracker
  BUCKET_NAME: metal-apricot-343704-fitness-tracker-data
  IMAGE: gcr.io/metal-apricot-343704/fitness-tracker

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write # lets GitHub issue the OIDC token Google trusts

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for the registry
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build image
        run: |
          docker build \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            -f Dockerfile .

      - name: Push image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Write .env.yaml from secret
        env:
          ENV_YAML: ${{ secrets.ENV_YAML }}
        run: |
          if [ -z "$ENV_YAML" ]; then
            echo "::error::The ENV_YAML secret is not set (see CI-DEPLOY.md)"
            exit 1
          fi
          printf '%s\n' "$ENV_YAML" > .env.yaml

      # The revision is named after the commit and run, so the steps below
      # can route traffic to exactly this revision and check it is serving.
      - name: Name the revision
        run: echo "REVISION=$SERVICE_NAME-${GITHUB_SHA::7}-r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --revision-suffix "${REVISION#"$SERVICE_NAME-"}" \
            --project "$PROJECT_ID" \
            --image "$IMAGE:$GITHUB_SHA" \
            --platform managed \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --execution-environment gen2 \
            --add-volume "name=data-volume,type=cloud-storage,bucket=$BUCKET_NAME" \
            --add-volume-mount volume=data-volume,mount-path=/mnt/data \
            --env-vars-file .env.yaml \
            --quiet

      - name: Remove .env.yaml
        if: always()
        run: rm -f .env.yaml

      # `gcloud run deploy` only moves traffic to the new revision while the
      # service routes to "latest". A deploy with --no-traffic (e.g. a tagged
      # preview) pins traffic to one revision, and every later deploy would
      # then get 0%. Route all traffic here explicitly; tags are kept.
      - name: Route traffic to the new revision
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --platform managed \
            --region "$REGION" \
            --to-revisions "$REVISION=100" \
            --quiet

      - name: Health check
        run: |
          SERVICE_JSON=$(gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --platform managed \
            --region "$REGION" \
            --format json)
          SERVICE_URL=$(jq -r '.status.url' <<< "$SERVICE_JSON")
          echo "Service URL: $SERVICE_URL"

          # Fail if this revision isn't the one taking the traffic
          PERCENT=$(jq -r --arg rev "$REVISION" \
            '[.status.traffic[] | select(.revisionName == $rev) | .percent // 0] | add // 0' <<< "$SERVICE_JSON")
          echo "Traffic to $REVISION: ${PERCENT}%"
          if [ "$PERCENT" != "100" ]; then
            echo "::error::$REVISION is serving ${PERCENT}% of traffic, not 100%"
            jq '.status.traffic' <<< "$SERVICE_JSON"
            exit 1
          fi

          # Allow for a cold start (min-instances is 0)
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            "$SERVICE_URL/api/health"
          echo
          echo "### Deployed \`${GITHUB_SHA::7}\` ($REVISION) to $SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
